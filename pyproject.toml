[build-system]
requires = ["hatchling>=1.32.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[project]
name = "package_name"
description = "A short description of your package"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
dynamic = ["version"]
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
license = {file = "LICENSE"}
keywords = ["keyword1", "keyword2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.4.2",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "doit>=0.36.0",
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.16.4",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "pymdown-extensions>=11.0.1",
    "codespell>=2.4.3",
    "pyproject-fmt>=2.28.0",
    "commitizen>=4.18.0",
    "pyright>=1.1.411",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0.12.20260815",
    "vulture>=2.11",
    "radon>=6.0",
    "pytest-benchmark>=5.3.0",
    "mutmut>=3.7.0",
    "hypothesis>=6.165.10",
]
security = [
    "pip-audit>=2.10.1",
    "bandit>=1.7",
    "pip>=26.2.1",
    "pip-licenses>=4.0",
    "cyclonedx-bom>=7.3.1",
]

[project.urls]
Homepage = "https://github.com/username/package_name"
Repository = "https://github.com/username/package_name"
Documentation = "https://github.com/username/package_name/tree/main/docs"
Issues = "https://github.com/username/package_name/issues"

[project.scripts]
package-name = "package_name.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/package_name"]

[tool.hatch.version]
source = "vcs"
tag-pattern = "^(?:v|d)(?P<version>.+)$"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/package_name/_version.py"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/_version.py"]

[tool.ruff.lint]
# Enable preview mode but require rules to be listed by exact code so we
# opt into PLW1514 without pulling in every other unstable preview rule.
preview = true
explicit-preview-rules = true
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations (type hints)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "RUF",  # Ruff-specific rules
    "SIM",  # flake8-simplify
    "ASYNC", # flake8-async
    "PLW1514",  # require explicit encoding on text-mode file I/O (preview rule)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tools/pyproject_template/*.py" = [
    "ANN401",  # Any return type for dynamic GitHub API responses
    "RUF022",  # __all__ intentionally grouped by category, not sorted
]
"tests/benchmarks/*.py" = [
    "ANN401",  # benchmark fixture has no py.typed
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_any_generics = false
disallow_incomplete_defs = true
disallow_subclassing_any = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
exclude = [".claude/", ".codex/"]

[[tool.mypy.overrides]]
module = "doit.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# tools/pyproject_template/ scripts run standalone and do `sys.path.insert`
# before importing their siblings by bare name (`from utils import ...`).
# mypy cannot resolve those, so suppress the import errors by naming the
# sibling modules. Suppressing only the imports — rather than excluding the
# directory, as this config previously did — keeps the other ~5,300 lines
# type-checked. See issue #700.
module = [
    "check_template_updates",
    "cleanup",
    "configure",
    "repo_settings",
    "settings",
    "setup_repo",
    "utils",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-config --strict-markers --benchmark-disable"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "benchmark: marks tests as performance benchmarks (deselect with '--benchmark-disable')",
    "property: marks tests as property-based tests (run with Hypothesis)",
]

[tool.pytest-benchmark]
disable_gc = true
min_rounds = 5
warmup = true

[tool.coverage.run]
branch = true
# `tools/` is the code that runs releases, creates PRs and blocks dangerous
# commands; gating only the package would measure the skeleton every downstream
# project deletes. See docs/development/ci-cd-testing.md for the downstream/template
# split.
source = ["package_name", "tools"]
# tools/pyproject_template/ is the template's own management suite. It is the
# one part of tools/ that does not belong to the spawned project: ADR-9017 makes
# its tests template-owned, and both spawn routes delete the suite itself. Left
# in scope it is measured downstream but never tested there, which put a spawned
# project 19 points under the gate (#731). Its tests still run in template CI.
omit = ["tools/pyproject_template/*"]

[tool.coverage.report]
skip_covered = false
show_missing = true
precision = 2
# Measured over package_name + tools/doit + tools/hooks — code that ships to and
# runs in the spawned project. Scope is deliberately shape-independent: the same
# code is measured by the same tests in the template and in a spawned project, so
# both report 73.27% and one threshold is honest in both. Before #731 the two
# shapes read 59.16% and 33.98%, and only the first was ever measured.
#
# Ratcheted 54 -> 70 in #708, which covered the three workflow entry points
# AGENTS.md mandates (`doit issue`, `doit pr`, `doit pr_merge`) and the release
# paths that mutate remote state: github.py 50.94% -> 81.50%, release.py
# 40.26% -> 60.53%.
#
# The ~3pp margin is deliberate — a threshold set exactly at the measured value
# fails on trivial variation, which trains people to lower it. Raise this again
# as the modules #708 lists next are paid down (manage.py 24%, maintenance.py
# 6.57%, generate_doc_toc.py 0%). Treat lowering it as a change that needs
# justification.
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "tmp/htmlcov"

[tool.coverage.xml]
output = "tmp/coverage.xml"

[tool.bandit]
exclude_dirs = [
    "tests",
    "tmp",
    ".venv",
    "docs",
    "examples",
    ".git",
    ".github",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "site",
    ".claude",
    ".codex",
    ".devcontainer",
    ".vscode",
]
skips = [
    "B101",
    "B603",
    "B607",
]

[tool.codespell]
skip = "tmp,.venv,.git,*.lock,*.pyc,__pycache__"
ignore-words-list = "crate"

[tool.vulture]
min_confidence = 80
paths = ["src", "tests", "tools"]
exclude = [
    "*/tests/*",      # Test fixtures often appear unused
    "*/__pycache__/*",
]
# Common false positives in Python projects
ignore_names = [
    # Imported under `if TYPE_CHECKING:` and referenced only from string
    # annotations (e.g. `console: "ConsoleType"`), which vulture does not
    # parse. Deleting these imports would break type checking.
    "ConsoleType",
    "test_*",         # Pytest test functions
    "fixture_*",      # Pytest fixtures
    "*_fixture",      # Pytest fixtures
    "setUp",          # unittest methods
    "tearDown",       # unittest methods
    "setUpClass",     # unittest methods
    "tearDownClass",  # unittest methods
]
ignore_decorators = [
    "@pytest.fixture",
    "@pytest.mark.*",
    "@click.command",
    "@click.option",
    "@click.group",
    "@abstractmethod",
]

[tool.mutmut]
paths_to_mutate = ["src/"]
tests_dir = ["tests/"]
runner = "uv run python -m pytest -x --assert=plain"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.0"
tag_format = "v$version"
version_provider = "scm"
update_changelog_on_bump = true
major_version_zero = true
merge_prerelease = true
bump_pattern = "^(feat|fix|refactor|perf)"
bump_map = { "feat" = "MINOR", "fix" = "PATCH", "refactor" = "PATCH", "perf" = "PATCH" }
change_type_order = ["BREAKING CHANGE", "feat", "fix", "refactor", "perf"]

[tool.pyright]
# LSP support for Claude Code - provides fast code navigation and type checking
include = [
    "src",
    "tests",
    "*.py",           # Root level Python files (dodo.py, setup-repo.py, configure.py)
    "tools",          # Tools directory
    ".github",        # Any Python in GitHub workflows/scripts
]
# tests/ is not a package, so pytest puts it on sys.path; mirror that here so
# shared test helpers (tests/agent_roster.py) resolve for the LSP too.
extraPaths = ["tests"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/tmp",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/site",        # mkdocs build output
    "**/.git",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingImports = true
reportMissingTypeStubs = false
